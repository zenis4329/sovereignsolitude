name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hiển thị phiên bản Xcode
        run: xcodebuild -version

      - name: Tự động xóa thư viện APIClient bị thiếu khỏi Project
        run: |
          # Xóa các dòng tham chiếu đến libAPIClient.a
          sed -i '' '/libAPIClient.a/d' ThreeOneOSFive.xcodeproj/project.pbxproj
          # Xóa flag -l"APIClient" trong phần cài đặt Linker
          sed -i '' 's/-l"APIClient",\?//g' ThreeOneOSFive.xcodeproj/project.pbxproj
          sed -i '' 's/-lAPIClient//g' ThreeOneOSFive.xcodeproj/project.pbxproj
          # Xóa đường dẫn tìm kiếm thư viện API bị lỗi
          sed -i '' 's|"$(SRCROOT)/API",\?||g' ThreeOneOSFive.xcodeproj/project.pbxproj
          sed -i '' 's|"$(PROJECT_DIR)/API",\?||g' ThreeOneOSFive.xcodeproj/project.pbxproj

      - name: Build dự án (Unsigned)
        run: |
          PROJECT_PATH="ThreeOneOSFive.xcodeproj"
          SCHEME_NAME="3105"
          
          echo "Bắt đầu build với Project: $PROJECT_PATH và Scheme: $SCHEME_NAME"
          
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build_output

      - name: Đóng gói thành file IPA
        run: |
          mkdir -p Payload
          find build_output/Build/Products/Release-iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          zip -r App.ipa Payload

      - name: Upload file IPA lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-Unsigned-IPA
          path: App.ipa
          retention-days: 7
