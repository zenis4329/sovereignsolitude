name: Unzip and Flatten

on:
  push:
    branches: [ main ]
    paths:
      - 'zenishnh-main.zip'
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # 关键修改：使用 PAT

      - name: Unzip and Move Files
        run: |
          unzip -o zenishnh-main.zip
          cp -a zenishnh-main/. .
          rm -rf zenishnh-main

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-unzip and remove nested folder"
          token: ${{ secrets.PAT_TOKEN }} # 关键修改：使用 PAT
