name: Extract Zip File

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install unzip -y

      - name: Extract zip and move to root
        run: |
          # 1. Giải nén vào thư mục tạm tên là temp_extract
          unzip -o zenishnh-main.zip -d temp_extract
          
          # 2. Bật dotglob để lệnh mv có thể di chuyển cả các file ẩn (như .gitignore)
          shopt -s dotglob
          
          # 3. Di chuyển toàn bộ nội dung bên trong thư mục zenishnh-main ra thư mục gốc (./)
          mv temp_extract/zenishnh-main/* ./
          
          # 4. Xóa thư mục tạm đi cho sạch
          rm -rf temp_extract
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Lệnh git add . sẽ thêm toàn bộ file đang nằm ở thư mục gốc
          git add .
          
          git commit -m "Auto-extract files directly to root" || echo "No changes to commit"
          git push
