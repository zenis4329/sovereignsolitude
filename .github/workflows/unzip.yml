name: Extract Zip File

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công từ tab Actions

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install unzip -y

      - name: Extract zenishnh-main.zip
        run: |
          mkdir -p extracted_data
          unzip zenishnh-main.zip -d extracted_data/
          
      - name: Verify extraction
        run: |
          echo "Danh sách các file đã được giải nén:"
          ls -la extracted_data/
