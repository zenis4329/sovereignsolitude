name: Extract Zip File

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Cấp quyền để Action có thể push code lên repo
permissions:
  contents: write

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install unzip -y

      - name: Extract zenishnh-main.zip
        run: |
          # Giải nén thẳng vào thư mục hiện tại (hoặc thư mục bạn muốn)
          unzip -o zenishnh-main.zip -d extracted_data/
          
      - name: Commit and Push changes
        run: |
          # Cấu hình user bot để commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Thêm các file mới giải nén vào git
          git add extracted_data/
          
          # Commit và push (bỏ qua nếu không có thay đổi nào mới)
          git commit -m "Auto-extract zenishnh-main.zip" || echo "No changes to commit"
          git push
