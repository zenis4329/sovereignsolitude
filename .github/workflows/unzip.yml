name: Extract Zip File

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install unzip and rsync
        run: sudo apt-get update && sudo apt-get install unzip rsync -y

      - name: Extract zip and merge to root
        run: |
          # 1. Giải nén vào thư mục tạm tên là temp_extract
          unzip -o zenishnh-main.zip -d temp_extract
          
          # 2. Sử dụng rsync để copy toàn bộ nội dung. 
          # rsync sẽ tự động gộp (merge) nội dung nếu thư mục .github bị trùng tên.
          rsync -a temp_extract/zenishnh-main/ ./
          
          # 3. Xóa thư mục tạm đi cho sạch
          rm -rf temp_extract
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "Auto-extract and merge files directly to root" || echo "No changes to commit"
          git push
